[project]
name = "universal-reference-resolver"
version = "0.1.0"
description = "Universal Reference Resolver (URR): resolve any external reference simply. An MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PStryder", email = "156626609+PStryder@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.scripts]
urr = "universal_reference_resolver.server:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
